<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>EEG Focus 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5da8b8',
                        secondary: '#8B5CF6',
                        'background-dark': '#0B1120',
                        'surface-dark': '#1E293B',
                        'surface-card': '#0F172A',
                        'background-light': '#F8FAFC',
                        'surface-light': '#FFFFFF',
                        'text-light': '#0F172A'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        display: ['EB Garamond', 'serif']
                    },
                    backgroundImage: {
                        'hero-glow': 'radial-gradient(circle at 50% 50%, rgba(93, 168, 184, 0.15), transparent 60%)',
                        'hero-glow-dark': 'radial-gradient(circle at 50% 50%, rgba(93, 168, 184, 0.25), transparent 70%)',
                        'gradient-dark': 'linear-gradient(to bottom, #0B1120, #0F172A)',
                        'gradient-light': 'linear-gradient(to bottom, #F8FAFC, #eef5f6)'
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app-root"></div>

    <div id="game-countdown">
        <div id="countdown-text"></div>
    </div>

    <div id="breathing-prompt" aria-live="polite" style="display: none;">
        <div class="breathing-prompt-pill">
            <span class="breathing-prompt-dot"></span>
            <span id="breathing-prompt-text">請留意呼吸，慢慢將注意力帶回畫面。</span>
        </div>
    </div>

    <div id="breathing-intervention" aria-live="polite" style="display: none;">
        <div class="breathing-panel">
            <div class="breathing-ring" id="breathing-ring"></div>
            <div class="breathing-copy">
                <div class="breathing-kicker">Focus Reset</div>
                <div class="breathing-title" id="breathing-title">Breathe and refocus</div>
                <div class="breathing-phase" id="breathing-phase">Inhale</div>
                <div class="breathing-helper" id="breathing-helper">Follow the ring to recover steady focus.</div>
            </div>
        </div>
    </div>

    <div id="transition-loader" style="display: none;">
        <div class="loader-content">
            <div class="spinner"></div>
            <div class="loading-text">Preparing game session...</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs",
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"
            }
        }
    </script>
    <script type="module" src="app/main.js?v=2026-06-24-23"></script>
</body>
</html>
