<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NeuroFocus hero visual</title>
  <desc id="desc">Abstract local visualization replacing the external Stitch hero image.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091527"/>
      <stop offset="55%" stop-color="#0e2237"/>
      <stop offset="100%" stop-color="#13263b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="45%" r="34%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#5da8b8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5da8b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="55%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur40">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur8">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="820" cy="420" r="260" fill="url(#glowA)"/>
  <circle cx="860" cy="430" r="320" fill="url(#glowB)"/>
  <g opacity="0.35" stroke="#5da8b8" fill="none">
