<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>NeuroFocus</title>
    <!-- Fonts are self-hosted from /vendor/fonts so the site renders identically
         with no internet (booth) and in regions where Google Fonts is blocked. -->
    <link href="/vendor/fonts/fonts.css?v=2026-07-25-5" rel="stylesheet">
    <!-- Tailwind is only used by the homepage layout; the game, setup and
         results pages ship their own CSS. It stays on the CDN for its JIT
         behaviour, with a pre-compiled copy loaded FIRST as a floor: when the
         venue network is dead the CDN never arrives and the homepage would
         otherwise lose all layout. Online, the CDN's own <style> comes later in
         document order and still wins, so nothing about the current look
         changes. Rebuild the fallback with:
           npx tailwindcss -c tailwind.config.js -i in.css -o vendor/tailwind/tailwind.fallback.css --minify
         The config below must never assume the CDN script loaded either: on a
         dead network the bare `tailwind.config = …` threw a ReferenceError that
         killed every page, so the global is defended here. -->
    <link href="/vendor/tailwind/tailwind.fallback.css?v=2026-07-25-5" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5da8b8',
                        secondary: '#8B5CF6',
                        'background-dark': '#0B1120',
                        'surface-dark': '#1E293B',
                        'surface-card': '#0F172A',
                        'background-light': '#F8FAFC',
                        'surface-light': '#FFFFFF',
                        'text-light': '#0F172A'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        display: ['EB Garamond', 'serif']
                    },
                    backgroundImage: {
                        'hero-glow': 'radial-gradient(circle at 50% 50%, rgba(93, 168, 184, 0.15), transparent 60%)',
                        'hero-glow-dark': 'radial-gradient(circle at 50% 50%, rgba(93, 168, 184, 0.25), transparent 70%)',
                        'gradient-dark': 'linear-gradient(to bottom, #0B1120, #0F172A)',
                        'gradient-light': 'linear-gradient(to bottom, #F8FAFC, #eef5f6)'
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app-root"></div>

    <div id="game-countdown">
        <div id="countdown-text"></div>
    </div>

    <div id="breathing-prompt" aria-live="polite" style="display: none;">
        <div class="breathing-prompt-pill">
            <span class="breathing-prompt-dot"></span>
            <span id="breathing-prompt-text">請留意呼吸，慢慢將注意力帶回畫面。</span>
        </div>
    </div>

    <div id="breathing-intervention" aria-live="polite" style="display: none;">
        <div class="breathing-panel">
            <div class="breathing-ring" id="breathing-ring"></div>
            <div class="breathing-copy">
                <div class="breathing-kicker">Focus Reset</div>
                <div class="breathing-title" id="breathing-title">Breathe and refocus</div>
                <div class="breathing-phase" id="breathing-phase">Inhale</div>
                <div class="breathing-helper" id="breathing-helper">Follow the ring to recover steady focus.</div>
                <div class="breathing-eeg-feedback" id="breathing-eeg-feedback" style="display: none;">
                    <div class="breathing-meditation-track"><div id="breathing-meditation-bar"></div></div>
                    <div class="breathing-meditation-label" id="breathing-meditation-label"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="transition-loader" style="display: none;">
        <div class="loader-content">
            <div class="loader-scene" aria-hidden="true">
                <span class="loader-boat">⛵</span>
                <span class="loader-sea"></span>
            </div>
            <div class="loader-brand">NeuroFocus</div>
            <div class="loading-text">正在準備你嘅航程…</div>
            <div class="loader-bar" aria-hidden="true"><span class="loader-bar-fill"></span></div>
        </div>
    </div>

    <!-- Three.js and MediaPipe are served from /vendor (self-hosted) so the game
         page and camera mode keep working with a dead/slow venue network and in
         regions where unpkg / jsdelivr / googleapis are unreachable.
         Supabase stays on the CDN: it already degrades gracefully to a local
         session when unreachable (services/supabaseClient.js). -->
    <script type="importmap">
        {
            "imports": {
                "three": "/vendor/three/three.module.js",
                "three/addons/": "/vendor/three/addons/",
                "@mediapipe/tasks-vision": "/vendor/mediapipe/vision_bundle.mjs",
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"
            }
        }
    </script>
    <script type="module" src="app/main.js?v=2026-07-25-5"></script>
</body>
</html>
