    <ellipse cx="820" cy="430" rx="280" ry="150"/>
    <ellipse cx="820" cy="430" rx="210" ry="110"/>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="4" opacity="0.85">
    <path d="M640 445c70-140 250-175 360-70 110 102 97 243 11 322"/>
    <path d="M690 360c40-40 96-64 155-64 71 0 135 31 177 81"/>
    <path d="M678 518c34 55 93 92 163 101 62 9 126-7 176-43"/>
  </g>
  <g fill="#7dd3fc" opacity="0.85">
    <circle cx="640" cy="445" r="8"/>
    <circle cx="748" cy="332" r="7"/>
    <circle cx="914" cy="302" r="8"/>
    <circle cx="1044" cy="380" r="9"/>
    <circle cx="1022" cy="545" r="8"/>
    <circle cx="870" cy="612" r="7"/>
    <circle cx="736" cy="574" r="7"/>
  </g>
  <g opacity="0.35">
